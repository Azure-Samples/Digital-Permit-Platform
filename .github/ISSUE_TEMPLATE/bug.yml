name: Bug report
description: Report a reproducible defect in the unmodified accelerator
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the sample. Do not include passwords, tokens, connection strings, SAS URLs, subscription or tenant IDs, customer data, or personal data. Report vulnerabilities privately through SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and which user journey or component is affected?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start from...
        2. Run or open...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Local containers
        - Azure deployment from this repository
        - Continuous integration
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit SHA, release, or branch used.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised diagnostics
      description: Include only the relevant error and tool versions after removing sensitive values and data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I reproduced this on the latest default branch where practical.
          required: true
        - label: I removed secrets, Azure identifiers, customer data, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
